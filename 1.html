<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>移动端输入框尺寸示例</title>
<style>
  /* 基础重置：模拟 375px 手机屏幕 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background-color: #F5F6F8;
    color: #1F2329;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }
  .mobile-screen {
    width: 375px;
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    overflow: hidden;
    padding-bottom: 24px;
  }
  .section-title {
    font-size: 13px;
    color: #8F959E;
    background: #F5F6F8;
    padding: 12px 16px 8px;
    font-weight: 500;
  }

  /* =========================================
     1. 紧凑型 (36px) - 顶部胶囊搜索框
     ========================================= */
  .search-bar-container {
    padding: 10px 16px;
    background: #FFFFFF;
  }
  .input-compact {
    width: 100%;
    height: 36px;               /* 紧凑高度：36px */
    border-radius: 18px;        /* 胶囊全圆角：高度的一半 */
    background-color: #F2F3F5;
    border: 1px solid transparent;
    padding: 0 14px;
    font-size: 16px;            /* 依然保持 16px 防 iOS 放大 */
    color: #1F2329;
    outline: none;
    transition: all 0.2s;
  }
  .input-compact::placeholder {
    font-size: 14px;            /* 占位符视觉上可缩小至 14px */
    color: #8F959E;
  }
  .input-compact:focus {
    background-color: #FFFFFF;
    border-color: #1677FF;
  }

  /* =========================================
     2. 标准型 (48px) - 独立边框表单
     ========================================= */
  .form-group {
    padding: 16px;
  }
  .form-label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: #1F2329;
    margin-bottom: 8px;
  }
  .input-standard {
    width: 100%;
    height: 48px;               /* 黄金标准高度：48px */
    padding: 12px 16px;         /* 上下12 + 行高24 = 48px */
    font-size: 16px;            /* 核心：≥16px 防止 iOS Safari 聚焦自动放大 */
    line-height: 24px;
    color: #1F2329;
    background-color: #FFFFFF;
    border: 1px solid #DEE0E3;
    border-radius: 8px;         /* 标准圆角：8px */
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-standard:focus {
    border-color: #1677FF;
    box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
  }

  /* =========================================
     3. 标准型 (48px) - 通栏列表式表单 (WeUI 风格)
     ========================================= */
  .cell-list {
    border-top: 1px solid #EBEDF0;
    border-bottom: 1px solid #EBEDF0;
    padding-left: 16px;
  }
  .cell-item {
    display: flex;
    align-items: center;
    height: 48px;               /* 单行列表高度：48px */
    padding-right: 16px;
    border-bottom: 1px solid #EBEDF0;
  }
  .cell-item:last-child {
    border-bottom: none;
  }
  .cell-title {
    width: 88px;
    font-size: 16px;
    color: #1F2329;
    flex-shrink: 0;
  }
  .cell-input {
    flex: 1;
    height: 100%;
    border: none;
    outline: none;
    font-size: 16px;
    color: #1F2329;
    background: transparent;
  }

  /* =========================================
     4. 宽松型 (56px) - 浮动标签 / 登录大输入框
     ========================================= */
  .floating-group {
    position: relative;
    margin: 16px;
  }
  .input-large {
    width: 100%;
    height: 56px;               /* 宽松型高度：56px */
    padding: 22px 16px 6px;     /* 为顶部浮动标签留出空间 */
    font-size: 16px;
    line-height: 24px;
    border: 1px solid #DEE0E3;
    border-radius: 8px;
    outline: none;
  }
  .floating-label {
    position: absolute;
    left: 16px;
    top: 18px;
    font-size: 16px;
    color: #8F959E;
    pointer-events: none;
    transition: all 0.2s ease;
  }
  /* 当聚焦或有内容时，标签上浮缩小 */
  .input-large:focus {
    border-color: #1677FF;
  }
  .input-large:focus + .floating-label,
  .input-large:not(:placeholder-shown) + .floating-label {
    top: 8px;
    font-size: 12px;
    color: #1677FF;
  }
</style>
</head>
<body>

<div class="mobile-screen">
  <div class="section-title">1. 紧凑型 (36px) - 顶部搜索框</div>
  <div class="search-bar-container">
    <input type="search" class="input-compact" placeholder="搜索商品、品牌或订单...">
  </div>

  <div class="section-title">2. 标准型 (48px) - 独立边框表单</div>
  <div class="form-group">
    <label class="form-label">预留手机号</label>
    <input type="tel" class="input-standard" placeholder="请输入 11 位手机号码">
  </div>

  <div class="section-title">3. 标准型 (48px) - 通栏列表式 (国内主流)</div>
  <div class="cell-list">
    <div class="cell-item">
      <span class="cell-title">收货人</span>
      <input type="text" class="cell-input" placeholder="请填写收货人姓名">
    </div>
    <div class="cell-item">
      <span class="cell-title">详细地址</span>
      <input type="text" class="cell-input" placeholder="街道、楼牌号等">
    </div>
  </div>

  <div class="section-title">4. 宽松型 (56px) - 内部浮动标签</div>
  <div class="floating-group">
    <input type="text" class="input-large" id="floatInput" placeholder=" " value="user@example.com">
    <label for="floatInput" class="floating-label">电子邮箱地址</label>
  </div>
</div>

</body>
</html>
