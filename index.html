<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>自定义表单构建器</title>
    <script>
      // 捕获旧版缓存 HTML 请求已更新的带 Hash JS/CSS 404 错误，自动刷新拉取最新入口
      window.addEventListener(
        'error',
        function (e) {
          var target = e.target || e.srcElement;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var src = target.src || target.href || '';
            if (src.indexOf('/assets/') !== -1) {
              var reloadKey = '__fb_asset_reload__';
              var lastReload = Number(sessionStorage.getItem(reloadKey) || 0);
              if (Date.now() - lastReload > 10000) {
                sessionStorage.setItem(reloadKey, String(Date.now()));
                var url = new URL(window.location.href);
                url.searchParams.set('_v', String(Date.now()));
                window.location.replace(url.toString());
              }
            }
          }
        },
        true
      );
    </script>
    <link rel="stylesheet" href="/libs/intlTelInput.min.css" />
    <script src="/libs/intlTelInputWithUtils.min.js"></script>
    <style>
      #app-init-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        z-index: 999999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #app-init-loader.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 320px;
        width: 100%;
      }
      .loader-logo-wrapper {
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader-logo {
        height: 36px;
        width: auto;
        max-width: 160px;
        object-fit: contain;
        user-select: none;
      }
      .loader-progress-track {
        width: 180px;
        height: 4px;
        background-color: #e2e8f0;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .loader-progress-bar {
        height: 100%;
        width: 15%;
        background: linear-gradient(90deg, #165dff, #3882ff);
        border-radius: 9999px;
        box-shadow: 0 0 8px rgba(22, 93, 255, 0.4);
        transition: width 0.25s ease;
      }
      .loader-status {
        margin-top: 14px;
        font-size: 12px;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: -0.01em;
      }
    </style>
  </head>
  <body class="h-screen w-screen overflow-hidden bg-[#f5f5f5] text-black/85 antialiased">
    <div id="app-init-loader">
      <div class="loader-content">
        <div class="loader-logo-wrapper">
          <img src="/logo.png" alt="AlgoCandy" class="loader-logo" />
        </div>
        <div class="loader-progress-track">
          <div class="loader-progress-bar" id="app-loader-bar"></div>
        </div>
        <div class="loader-status" id="app-loader-status">正在加载设计工作台...</div>
      </div>
    </div>

    <div id="app" class="h-full w-full"></div>

    <script>
      (function () {
        var bar = document.getElementById('app-loader-bar');
        var progress = 15;
        var timer = setInterval(function () {
          if (progress < 85) {
            progress += Math.floor(Math.random() * 10) + 6;
            if (progress > 85) progress = 85;
            if (bar) bar.style.width = progress + '%';
          }
        }, 120);

        window.__dismissAppLoader = function () {
          if (!timer) return;
          clearInterval(timer);
          timer = null;
          if (bar) bar.style.width = '100%';
          var status = document.getElementById('app-loader-status');
          if (status) status.innerText = '加载就绪';
          setTimeout(function () {
            var loader = document.getElementById('app-init-loader');
            if (loader) {
              loader.classList.add('fade-out');
              setTimeout(function () {
                if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
              }, 400);
            }
          }, 120);
        };

        setTimeout(function () {
          if (window.__dismissAppLoader) window.__dismissAppLoader();
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
